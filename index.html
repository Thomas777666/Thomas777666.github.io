<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JARVIS Interface</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">

<style>
body {
    margin: 0;
    font-family: 'Orbitron', sans-serif;
    background: radial-gradient(circle at center, #020617, #000000);
    color: #00f7ff;
    overflow-x: hidden;
}

/* HEADER */
header {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    width: 100%;
    box-sizing: border-box;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px 30px;
    border-bottom: 1px solid #00f7ff33;
    background: rgba(2, 6, 23, 0.85);
    backdrop-filter: blur(10px);
    z-index: 1000;
}

/* NAV */
nav {
    position: relative;
    display: flex;
    gap: 15px;
}

nav a {
    margin: 0 15px;
    text-decoration: none;
    color: #00f7ff;
    position: relative;
}

nav a::after {
    content: '';
    position: absolute;
    width: 0%;
    height: 2px;
    background: #00f7ff;
    left: 0;
    bottom: -5px;
    transition: 0.3s;
}

nav a:hover::after {
    width: 100%;
}

/* INDICATOR */
nav .indicator {
    position: absolute;
    top: -6px;
    left: 0;
    height: 32px;
    width: 0;
    border-radius: 12px;
    border: 1px solid #00f7ff55;
    background: rgba(0, 247, 255, 0.08);
    backdrop-filter: blur(6px);
    transition: all 0.3s ease;
    z-index: 0;
    pointer-events: none;
}

/* LOGIN */
.login-icon {
    border: 1px solid #00f7ff;
    padding: 8px 12px;
    cursor: pointer;
    transition: 0.3s;
}

.login-icon:hover {
    background: #00f7ff;
    color: black;
}

/* CENTER */
.center-panel {
    position: relative;
    margin-top: 80px;
    text-align: center;
}

.center-panel h1 {
    font-size: 48px;
    text-shadow: 0 0 20px #00f7ff;
    margin: 0;
}

.center-panel p {
    opacity: 0.7;
    margin-top: 8px;
}

/* SECTIONS */
.section {
    padding: 100px 40px;
    opacity: 0;
    transform: translateY(40px);
    transition: 0.8s;
}

.section.active {
    opacity: 1;
    transform: translateY(0);
}

.card {
    border: 1px solid #00f7ff33;
    padding: 20px;
    border-radius: 10px;
    background: rgba(0, 247, 255, 0.05);
}

/* ANIMATION */
@keyframes fadeIn {
    from {opacity: 0; transform: translateY(20px);}
    to {opacity: 1; transform: translateY(0);}
}
</style>
</head>

<body>

<header>
    <h2>JARVIS</h2>

    <nav>
        <div class="indicator"></div>

        <a href="#about">ABOUT US</a>
        <a href="#download">DOWNLOAD</a>
        <a href="#donate">DONATE</a>
        <a href="#privacy">PRIVACY POLICY</a>
        <a href="#contact">CONTACT</a>
    </nav>

    <div class="login-icon" onclick="openLogin()">LOGIN</div>
</header>

<div class="center-panel">
    <h1>JARVIS</h1>
    <p>Artificial Intelligence System</p>
</div>

<div class="section" id="about"><div class="card"><h2>ABOUT US</h2></div></div>
<div class="section" id="download"><div class="card"><h2>DOWNLOAD</h2></div></div>
<div class="section" id="donate"><div class="card"><h2>DONATE / PLANS</h2></div></div>
<div class="section" id="privacy"><div class="card"><h2>PRIVACY POLICY</h2></div></div>
<div class="section" id="contact"><div class="card"><h2>CONTACT</h2></div></div>

<!-- LOGIN -->
<div class="modal" id="loginModal">
    <div class="modal-content">
        <h3>LOGIN</h3>
        <input type="text">
        <input type="password">
        <button onclick="closeLogin()">Enter</button>
    </div>
</div>

<script>
function openLogin(){
    document.getElementById('loginModal').style.display = 'flex';
}
function closeLogin(){
    document.getElementById('loginModal').style.display = 'none';
}

/* scroll animation */
const sections = document.querySelectorAll('.section');
window.addEventListener('scroll', () => {
    sections.forEach(sec => {
        const top = sec.getBoundingClientRect().top;
        if(top < window.innerHeight - 100){
            sec.classList.add('active');
        }
    });
});

/* indicator menu */
const links = document.querySelectorAll("nav a");
const indicator = document.querySelector("nav .indicator");

function moveIndicator(el) {
    indicator.style.width = el.offsetWidth + "px";
    indicator.style.left = el.offsetLeft + "px";
}

links.forEach(link => {
    link.addEventListener("click", () => {
        moveIndicator(link);
    });
});

window.addEventListener("load", () => {
    moveIndicator(links[0]);
});
</script>

</body>
</html>
