<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JARVIS Interface</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">

<style>
body {
    margin: 0;
    font-family: 'Orbitron', sans-serif;
    background: radial-gradient(circle at center, #020617, #000000);
    color: #00f7ff;
    overflow-x: hidden;
    padding-top: 70px;
}

/* HEADER */
header {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px 30px;
    border-bottom: 1px solid #00f7ff33;
    background: rgba(2, 6, 23, 0.85);
    backdrop-filter: blur(10px);
    z-index: 1000;
}

nav {
    position: relative;
    display: flex;
    gap: 15px;
}

nav a {
    text-decoration: none;
    color: #00f7ff;
    position: relative;
    padding: 6px 10px;
}

.indicator {
    position: absolute;
    top: -4px;
    left: 0;
    height: 32px;
    border-radius: 10px;
    border: 1px solid #00f7ff55;
    background: rgba(0, 247, 255, 0.08);
    transition: 0.3s;
    z-index: 0;
}

/* LOGIN */
.login-icon {
    border: 1px solid #00f7ff;
    padding: 8px 12px;
    cursor: pointer;
}

/* CENTER */
.center-panel {
    position: relative;
    margin-top: 40px;
    text-align: center;
}

.center-panel h1 {
    font-size: 48px;
    text-shadow: 0 0 20px #00f7ff;
    margin: 0;
}

/* SECTIONS */
.section {
    padding: 100px 40px;
    opacity: 0;
    transform: translateY(40px);
    transition: 0.8s;
}

.section.active {
    opacity: 1;
    transform: translateY(0);
}

.card {
    border: 1px solid #00f7ff33;
    padding: 20px;
    border-radius: 10px;
    background: rgba(0, 247, 255, 0.05);
}

/* PLANS */
.plans {
    display: flex;
    gap: 20px;
    flex-wrap: wrap;
}

.plan {
    flex: 1;
    min-width: 200px;
    border: 1px solid #00f7ff33;
    padding: 20px;
    border-radius: 12px;
    background: rgba(0, 247, 255, 0.05);
}

/* MODAL */
.modal {
    position: fixed;
    inset: 0;
    display: none;
    justify-content: center;
    align-items: center;
    background: rgba(0,0,0,0.8);
}

.modal-content {
    background: #020617;
    padding: 30px;
    border: 1px solid #00f7ff;
    width: 300px;
}

input {
    width: 100%;
    margin-bottom: 10px;
    padding: 8px;
    background: black;
    border: 1px solid #00f7ff33;
    color: #00f7ff;
}
</style>
</head>

<body>

<header>
    <h2>JARVIS</h2>

    <nav>
        <div class="indicator"></div>

        <a href="#about">ABOUT US</a>
        <a href="#download">DOWNLOAD</a>
        <a href="#donate">DONATE</a>
        <a href="#privacy">PRIVACY POLICY</a>
        <a href="#contact">CONTACT</a>
    </nav>

    <div class="login-icon" onclick="openLogin()">LOGIN</div>
</header>

<div class="center-panel">
    <h1>JARVIS</h1>
    <p>Artificial Intelligence System</p>
</div>

<!-- SECTIONS -->
<div class="section" id="about"><div class="card"><h2>ABOUT US</h2><p>Advanced AI interface system.</p></div></div>

<div class="section" id="download"><div class="card"><h2>DOWNLOAD</h2><button>Download</button></div></div>

<div class="section" id="donate">
    <div class="card">
        <h2>DONATE / PLANS</h2>
        <div class="plans">

            <div class="plan">
                <h3>BASIC</h3>
                <p>FREE</p>
            </div>

            <div class="plan">
                <h3>PLUS</h3>
                <p>$5 / month</p>
            </div>

            <div class="plan">
                <h3>PRO</h3>
                <p>$10 / month</p>
            </div>

        </div>
    </div>
</div>

<div class="section" id="privacy">
    <div class="card">
        <h2>PRIVACY POLICY</h2>
        <p>All privacy text here...</p>
    </div>
</div>

<div class="section" id="contact">
    <div class="card">
        <h2>CONTACT</h2>
        <p>support@jarvis.ai</p>
    </div>
</div>

<!-- LOGIN -->
<div class="modal" id="loginModal">
    <div class="modal-content">
        <h3>LOGIN</h3>
        <input type="text">
        <input type="password">
        <button onclick="closeLogin()">Enter</button>
    </div>
</div>

<script>
function openLogin(){
    document.getElementById("loginModal").style.display = "flex";
}

function closeLogin(){
    document.getElementById("loginModal").style.display = "none";
}

const links = document.querySelectorAll("nav a");
const indicator = document.querySelector(".indicator");

function moveIndicator(el){
    indicator.style.width = el.offsetWidth + "px";
    indicator.style.left = el.offsetLeft + "px";
}

links.forEach(link => {
    link.addEventListener("click", () => moveIndicator(link));
});

window.addEventListener("load", () => {
    moveIndicator(links[0]);
});

// scroll animation
const sections = document.querySelectorAll(".section");

window.addEventListener("scroll", () => {
    sections.forEach(sec => {
        const top = sec.getBoundingClientRect().top;
        if(top < window.innerHeight - 100){
            sec.classList.add("active");
        }
    });
});
</script>

</body>
</html>
