<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JARVIS Interface</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">

<style>
body {
    margin: 0;
    font-family: 'Orbitron', sans-serif;
    background: radial-gradient(circle at center, #020617, #000000);
    color: #00f7ff;
    overflow-x: hidden;
}

/* HEADER */
header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 20px 40px;
    border-bottom: 1px solid #00f7ff33;
}

/* NAV WRAPPER (ДОБАВЛЕНО) */
nav {
    position: relative;
    display: flex;
}

/* LINKS */
nav a {
    margin: 0 15px;
    text-decoration: none;
    color: #00f7ff;
    position: relative;
    z-index: 2;
}

nav a::after {
    content: '';
    position: absolute;
    width: 0%;
    height: 2px;
    background: #00f7ff;
    left: 0;
    bottom: -5px;
    transition: 0.3s;
}

nav a:hover::after {
    width: 100%;
}

/* 🔥 ACTIVE INDICATOR (ДОБАВЛЕНО) */
.indicator {
    position: absolute;
    top: -6px;
    left: 0;
    height: 32px;
    border-radius: 10px;
    background: rgba(0, 247, 255, 0.1);
    border: 1px solid #00f7ff55;
    transition: all 0.3s ease;
    z-index: 1;
    pointer-events: none;
}

/* LOGIN ICON */
.login-icon {
    border: 1px solid #00f7ff;
    padding: 8px 12px;
    cursor: pointer;
    transition: 0.3s;
}

.login-icon:hover {
    background: #00f7ff;
    color: black;
}

.center-panel {
    position: relative;
    margin-top: 60px;
    text-align: center;
    animation: fadeIn 1.5s ease;
}

.center-panel h1 {
    font-size: 48px;
    text-shadow: 0 0 20px #00f7ff;
    margin: 0;
}

.center-panel p {
    opacity: 0.7;
    margin-top: 8px;
}

/* BUTTON */
button {
    margin-top: 20px;
    background: transparent;
    border: 1px solid #00f7ff;
    color: #00f7ff;
    padding: 10px 20px;
    cursor: pointer;
    transition: 0.3s;
}

button:hover {
    background: #00f7ff;
    color: black;
    box-shadow: 0 0 15px #00f7ff;
}

/* SECTIONS */
.section {
    padding: 100px 40px;
}

/* ANIMATION */
@keyframes fadeIn {
    from {opacity: 0; transform: translateY(20px);} 
    to {opacity: 1; transform: translateY(0);} 
}

</style>
</head>

<body>

<header>
    <h2>JARVIS</h2>

    <nav>
        <!-- ИНДИКАТОР -->
        <div class="indicator"></div>

        <a href="#about">ABOUT US</a>
        <a href="#download">DOWNLOAD</a>
        <a href="#donate">DONATE</a>
        <a href="#privacy">PRIVACY POLICY</a>
        <a href="#contact">CONTACT</a>
    </nav>

    <div class="login-icon">LOGIN</div>
</header>

<div class="center-panel">
    <h1>JARVIS</h1>
    <p>Artificial Intelligence System</p>
</div>

<div class="section" id="about"><h2>ABOUT US</h2></div>
<div class="section" id="download"><h2>DOWNLOAD</h2></div>
<div class="section" id="donate"><h2>DONATE</h2></div>
<div class="section" id="privacy"><h2>PRIVACY</h2></div>
<div class="section" id="contact"><h2>CONTACT</h2></div>

<script>
const links = document.querySelectorAll("nav a");
const indicator = document.querySelector(".indicator");

function moveIndicator(el) {
    indicator.style.width = el.offsetWidth + "px";
    indicator.style.left = el.offsetLeft + "px";
}

links.forEach(link => {
    link.addEventListener("click", () => {
        moveIndicator(link);
    });
});

window.addEventListener("load", () => {
    moveIndicator(links[0]);
});
</script>

</body>
</html>
